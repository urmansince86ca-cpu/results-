<style>
html, body {
  margin: 0;
  padding: 0;
  background: #f7f9f8;
  color: #15231c;
}

#professors-results-frame {
  display: block;
  width: 100%;
  height: 2800px;
  border: 0;
  background: #f7f9f8;
}

.btn:hover {
  background: #00df80;
  color: #072c19;
  border-color: #00b96b;
}
</style>

<iframe
  id="professors-results-frame"
  src="https://urmansince86ca-cpu.github.io/results-/"
  title="Professors Picks results and historical records"
  scrolling="no"
></iframe>

<script>
(function () {
  var frame = document.getElementById(
    "professors-results-frame"
  );

  var githubOrigin =
    "https://urmansince86ca-cpu.github.io";

  window.addEventListener("message", function (event) {
    if (event.origin !== githubOrigin) return;
    if (event.source !== frame.contentWindow) return;

    var data = event.data;

    if (
      !data ||
      data.type !== "professors-results-height"
    ) return;

    var height = Number(data.height);

    if (
      !Number.isFinite(height) ||
      height < 100 ||
      height > 200000
    ) return;

    frame.style.height = Math.ceil(height) + "px";
  });

  frame.addEventListener("load", function () {
    frame.contentWindow.postMessage({
      type: "professors-results-measure"
    }, githubOrigin);
  });
})();
</script>
